spring.application.name=utilex

#Configuración del servidor
server.port=8080

#Conexión al servidor MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/utilex_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Configuración de JPA, 'update': crea o actualiza las tablas automáticamente al iniciar el proyecto
spring.jpa.hibernate.ddl-auto=update

#Muestra en la consola de Spring las sentencias SQL que Hibernate ejecuta
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true